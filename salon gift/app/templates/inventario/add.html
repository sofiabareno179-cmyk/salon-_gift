{% extends "base.html" %}

{% block title %}Nuevo Registro de Inventario{% endblock %}

{% block body_class %}inventory-page{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/inve.css') }}">
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8"> <div class="card card-luxury">
                
                <div class="card-header-gold">
                    <h5 class="mb-0"><i class="fas fa-crown"></i> Nuevo Registro</h5>
                </div>

                <div class="card-body">
                    <form action="{{ url_for('inventario.nuevo_item') }}" method="POST">
                        
                        <div class="form-group">
                            <label class="form-label" for="stock">Cantidad Disponible</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-star"></i> <input type="number" id="stock" name="stock" placeholder="00" min="0" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="fecha">Fecha de Registro</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-calendar-alt"></i> <input type="date" id="fecha" name="fecha" required>
                            </div>
                        </div>

                        <div class="action-buttons">
                            <button type="submit" class="btn btn-gold">
                                GUARDAR CAMBIOS
                            </button>
                            <a href="{{ url_for('inventario.listar_inventario') }}" class="btn btn-pink-outline">
                                Volver al Listado
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
