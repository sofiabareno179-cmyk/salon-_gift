<style>
    @import url('https://googleapis.com');

    .hair-services-container {
        padding: 100px 20px;
        text-align: center;
        background: #fdfdfd;
        /* Fondo con degradado sutil de salón premium */
        background-image: 
            radial-gradient(at 0% 0%, rgba(212, 175, 55, 0.1) 0, transparent 50%), 
            radial-gradient(at 100% 100%, rgba(20, 20, 20, 0.05) 0, transparent 50%);
        font-family: 'Montserrat', sans-serif;
        position: relative;
        overflow: hidden;
    }

    .hair-services-container h1 {
        position: relative;
        z-index: 1;
        font-family: 'Playfair Display', serif;
        font-size: 3.5rem;
        color: #1a1a1a;
        margin-bottom: 5px;
        font-weight: 700;
    }

    .hair-subtitle {
        position: relative;
        z-index: 1;
        font-family: 'Playfair Display', serif;
        font-style: italic;
        color: #b8973d; /* Tono Dorado */
        font-size: 1.2rem;
        margin-bottom: 60px;
        display: block;
    }

    .hair-subtitle::after {
        content: "";
        display: block;
        width: 60px;
        height: 2px;
        background: #b8973d;
        margin: 15px auto;
    }

    .hair-grid {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 30px;
        max-width: 1200px;
        margin: 0 auto;
    }

    .card-hair {
        background: white;
        border-radius: 5px 40px 5px 40px; /* Corte asimétrico diferente al de uñas */
        padding: 20px;
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        border: 1px solid #f0f0f0;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    .card-hair:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 40px rgba(184, 151, 61, 0.2);
        border-color: #b8973d;
    }

    .img-hair {
        width: 100%;
        height: 350px;
        border-radius: 0 30px 0 30px;
        margin-bottom: 25px;
        background: #222;
        overflow: hidden;
    }

    .img-hair img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.8s ease;
    }

    .card-hair:hover .img-hair img {
        transform: scale(1.1);
    }

    .card-hair h3 {
        font-family: 'Playfair Display', serif;
        font-size: 1.6rem;
        color: #1a1a1a;
        margin: 10px 0;
    }

    .hair-details {
        border-top: 1px solid #eee;
        border-bottom: 1px solid #eee;
        padding: 15px 0;
        margin: 20px 0;
        display: flex;
        justify-content: space-around;
        color: #666;
    }

    .hair-details strong {
        display: block;
        color: #b8973d;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .btn-hair {
        background: #1a1a1a;
        color: #fff;
        border: none;
        padding: 18px 30px;
        border-radius: 0 20px 0 20px;
        text-transform: uppercase;
        font-size: 0.8rem;
        letter-spacing: 2px;
        cursor: pointer;
        transition: 0.4s;
        width: 100%;
        font-weight: 600;
    }

    .btn-hair:hover {
        background: #b8973d;
        color: white;
        box-shadow: 0 10px 20px rgba(184, 151, 61, 0.3);
    }
</style>

<section class="hair-services-container">
    <h1>Peluquería & Estilo</h1>
    <span class="hair-subtitle">El arte de crear belleza en cada fibra de tu cabello</span>

    <div class="hair-grid">
        <!-- Ejemplo 1 -->
        <div class="card-hair">
            <div class="img-hair">
                <img src="https://unsplash.com" alt="Corte Profesional">
            </div>
            <h3>Peinado</h3>
            <div class="hair-details">
                <span><strong>Precio</strong> Desde $35.000</span>
                <span><strong>Tiempo</strong> 45 min</span>
            </div>
            <button class="btn-hair">Reservar Cita</button>
        </div>

        <!-- Ejemplo 2 -->
        <div class="card-hair">
            <div class="img-hair">
                <img src="https://unsplash.com" alt="Colorimetría">
            </div>
            <h3>Corte</h3>
            <div class="hair-details">
                <span><strong>Precio</strong> Desde $120.000</span>
                <span><strong>Tiempo</strong> 180 min</span>
            </div>
            <button class="btn-hair">Reservar Cita</button>
        </div>

        <!-- Ejemplo 3 -->
        <div class="card-hair">

            </div>
            <button class="btn-hair">Reservar Cita</button>
        </div>
