{% extends "base.html" %}

{% block body_class %}servicios-page{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/servicios.css') }}">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="premium-form-card animate-fade-in">
                <!-- Premium Header -->
                <div class="premium-header text-white">
                    <h3 class="text-capitalize">
                        <i class="fas fa-plus-circle me-2"></i>
                        Agregar a {{ categoria }}
                    </h3>
                </div>
                
                <div class="card-body p-5">
                    <form action="{{ url_for('servicio.add', categoria=categoria) }}" method="POST" enctype="multipart/form-data">
                        
                        <!-- Service Name -->
                        <div class="custom-input-group">
                            <label for="nombre">Nombre del Servicio</label>
                            <div class="input-icon-wrapper">
                                <i class="fas fa-magic"></i>
                                <input type="text" id="nombre" name="nombre" class="custom-input input-with-icon" 
                                       placeholder="Ej. Corte de Cabello Premium" required autofocus>
                            </div>
                        </div>

                        <!-- Image Upload -->
                        <div class="custom-input-group">
                            <label for="imagen">Imagen del Servicio</label>
                            <div class="input-icon-wrapper">
                                <i class="fas fa-image"></i>
                                <input type="file" id="imagen" name="imagen" class="custom-input input-with-icon" accept="image/*">
                            </div>
                            <small class="text-muted">Sube una foto desde tu galería o computador.</small>
                        </div>

                        <!-- Category Selection -->
                        <div class="custom-input-group">
                            <label for="categoria">Categoría</label>
                            <div class="input-icon-wrapper">
                                <i class="fas fa-list"></i>
                                <select id="categoria" name="categoria" class="custom-input input-with-icon" required>
                                    <option value="peluqueria" {% if categoria == 'peluqueria' %}selected{% endif %}>Peluquería</option>
                                    <option value="manicure" {% if categoria == 'manicure' %}selected{% endif %}>Manicure</option>
                                    <option value="tratamiento" {% if categoria == 'tratamiento' %}selected{% endif %}>Tratamiento</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <!-- Price -->
                            <div class="col-md-6">
                                <div class="custom-input-group">
                                    <label for="precio">Precio ($)</label>
                                    <div class="input-icon-wrapper">
                                        <i class="fas fa-tag"></i>
                                        <input type="number" step="0.01" id="precio" name="precio" 
                                               class="custom-input input-with-icon" placeholder="0.00" required>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Duration -->
                            <div class="col-md-6">
                                <div class="custom-input-group">
                                    <label for="duracion">Duración (min)</label>
                                    <div class="input-icon-wrapper">
                                        <i class="fas fa-clock"></i>
                                        <input type="number" id="duracion" name="duracion" 
                                               class="custom-input input-with-icon" placeholder="30" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid gap-3 mt-4">
                            <button type="submit" class="btn-premium-save">
                                <i class="fas fa-save me-2"></i>Guardar Servicio
                            </button>
                            <a href="{% if categoria == 'peluqueria' %}{{ url_for('servicio.ver_peluqueria') }}{% elif categoria == 'manicure' %}{{ url_for('servicio.manicure') }}{% else %}{{ url_for('servicio.tratamientos') }}{% endif %}" 
                               class="btn-premium-cancel">
                                <i class="fas fa-arrow-left me-2"></i>Cancelar y Volver
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
