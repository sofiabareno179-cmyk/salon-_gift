{% extends "base.html" %}

{% block body_class %}servicios-page{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/servicios.css') }}">
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <!-- Dinamismo en el color de la cabecera según la categoría -->
                <div class="card-header 
                    {% if categoria == 'peluqueria' %}bg-primary
                    {% elif categoria == 'tratamiento' %}bg-info
                    {% elif categoria == 'manicure' %}bg-danger
                    {% else %}bg-dark{% endif %} text-white text-center py-3">
                    <h3 class="mb-0 text-capitalize">Agregar a {{ categoria }}</h3>
                </div>
                
                <div class="card-body p-4">
                    <!-- Es buena práctica especificar el action, aunque si está vacío apunta a la misma URL -->
                    <form action="{{ url_for('servicio.add', categoria=categoria) }}" method="POST">
                        
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold">Nombre del Servicio</label>
                            <input type="text" id="nombre" name="nombre" class="form-control form-control-lg" 
                                   placeholder="Ej. Corte de Cabello" required autofocus>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="precio" class="form-label fw-bold">Precio ($)</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" step="0.01" id="precio" name="precio" 
                                           class="form-control" placeholder="0.00" required>
                                </div>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="duracion" class="form-label fw-bold">Duración (min)</label>
                                <div class="input-group">
                                    <input type="number" id="duracion" name="duracion" 
                                           class="form-control" placeholder="30" required>
                                    <span class="input-group-text">min</span>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-save me-2"></i>Guardar Servicio
                            </button>
                            <!-- Botón para volver a la lista específica de la categoría -->
                           <a href="{{ url_for('servicio.ver_peluqueria' if categoria == 'peluqueria' else 'servicio.' + (categoria if categoria != 'tratamiento' else 'tratamientos')) }}" 
   class="btn btn-light border">
   Cancelar y Volver
</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
