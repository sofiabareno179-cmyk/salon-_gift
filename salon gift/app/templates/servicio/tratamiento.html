

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/servicios.css') }}">
<style>
    /* Importación de fuentes */
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap');

    .services-container {
        padding: 80px 20px;
        text-align: center;
        background: #fffafa;
        background-image: 
            radial-gradient(at 0% 0%, rgba(244, 207, 223, 0.3) 0, transparent 50%), 
            radial-gradient(at 100% 100%, rgba(252, 228, 236, 0.4) 0, transparent 50%);
        font-family: 'Montserrat', sans-serif;
        position: relative;
        overflow: hidden;
    }

    /* Decoraciones animadas de fondo */
    .services-container::after {
        content: "";
        position: absolute;
        border-radius: 50% 20% 50% 70%;
        filter: blur(60px);
        z-index: 0;
        opacity: 0.5;
        width: 350px;
        height: 350px;
        background: #fce4ec;
        bottom: -50px;
        right: -50px;
        animation: drift 15s infinite alternate-reverse;
    }

    @keyframes drift {
        from { transform: translate(0,0) rotate(0deg); }
        to { transform: translate(30px, 50px) rotate(15deg); }
    }

    .services-container h1 {
        position: relative;
        z-index: 1;
        font-family: 'Playfair Display', serif;
        font-size: 3rem;
        color: #333;
        margin-bottom: 5px;
        font-weight: 700;
    }

    .services-subtitle {
        position: relative;
        z-index: 1;
        font-family: 'Playfair Display', serif;
        font-style: italic;
        color: #d4a5b9;
        font-size: 1.2rem;
        margin-bottom: 50px;
        display: block;
    }

    .services-subtitle::after {
        content: "";
        display: block;
        width: 60px;
        height: 2px;
        background: #f4cfdf;
        margin: 15px auto;
    }

    .gallery-grid {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 30px;
        max-width: 1100px;
        margin: 0 auto;
    }

    .card-treatment {
        background: white;
        border-radius: 30px 30px 10px 10px;
        padding: 20px;
        transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        border: none;
        box-shadow: 0 10px 30px rgba(244, 207, 223, 0.2);
    }

    .card-treatment:hover {
        transform: translateY(-12px);
        box-shadow: 0 20px 40px rgba(212, 165, 185, 0.3);
    }

    .img-placeholder {
        width: 100%;
        height: 280px;
        border-radius: 25px 25px 10px 10px;
        margin-bottom: 20px;
        background: #fce4ec;
        position: relative;
        overflow: hidden;
    }

    .img-placeholder::after {
        content: "";
        position: absolute;
        top: -50%;
        left: -100%;
        width: 50%;
        height: 200%;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
        transform: rotate(30deg);
        transition: 0.6s;
    }

    .card-treatment:hover .img-placeholder::after {
        left: 150%;
    }

    .img-placeholder img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.8s ease;
    }

    .card-treatment:hover .img-placeholder img {
        transform: scale(1.1);
    }

    .card-treatment h3 {
        font-family: 'Playfair Display', serif;
        font-size: 1.5rem;
        color: #4a4a4a;
        margin: 10px 0;
    }

    .details {
        border-top: 1px solid #fdf0f5;
        border-bottom: 1px solid #fdf0f5;
        padding: 12px 0;
        margin: 15px 0;
        display: flex;
        justify-content: space-around;
        color: #777;
        font-size: 0.85rem;
    }

    .details strong {
        display: block;
        color: #d4a5b9;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .btn-treatment {
        background: linear-gradient(135deg, #f4cfdf 0%, #d4a5b9 100%);
        color: white;
        border: none;
        padding: 16px;
        border-radius: 12px;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 2px;
        cursor: pointer;
        transition: 0.4s;
        width: 100%;
        font-weight: 600;
    }

    .btn-treatment:hover {
        filter: brightness(1.05);
        box-shadow: 0 8px 15px rgba(212, 165, 185, 0.4);
    }
</style>
{% endblock %}

{% block content %}
<section class="services-container">
    <h1>Tratamientos de Bienestar</h1>
    <span class="services-subtitle">Renueva tu piel y equilibra tu cuerpo</span>
    
    <div class="gallery-grid">
        <!-- Servicio 1 -->
        <div class="card-treatment">
            <div class="img-placeholder">
                <img src="https://pexels.com" alt="Limpieza Facial Profunda">
            </div>
            <h3>Facial Profundo</h3>
            <div class="details">
                <span><strong>Precio</strong> $95.000</span>
                <span><strong>Tiempo</strong> 60 min</span>
            </div>
            <button class="btn-treatment">Reservar Experiencia</button>
        </div>

        <!-- Servicio 2 -->
        <div class="card-treatment">
            <div class="img-placeholder">
                <img src="https://pexels.com" alt="Masaje Relajante">
            </div>
            <h3>Masaje Relajante</h3>
            <div class="details">
                <span><strong>Precio</strong> $120.000</span>
                <span><strong>Tiempo</strong> 75 min</span>
            </div>
            <button class="btn-treatment">Reservar Experiencia</button>
        </div>

        <!-- Servicio 3 -->
        <div class="card-treatment">
            <div class="img-placeholder">
                <img src="https://pexels.com" alt="Exfoliación Corporal">
            </div>
            <h3>Exfoliación Corporal</h3>
            <div class="details">
                <span><strong>Precio</strong> $140.000</span>
                <span><strong>Tiempo</strong> 90 min</span>
            </div>
            <button class="btn-treatment">Reservar Experiencia</button>
        </div>
    </div>
</section>
{% endblock %}
