{% extends "base.html" %}

{% block body_class %}profile-page{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">
{% endblock %}

{% block content %}
<div class="profile-container">
    <div class="profile-card">
        <div class="profile-card__header">
            <h2 class="profile-card__title">Agregar Perfil</h2>
            <p class="profile-card__subtitle">Configura la información del nuevo perfil para SalonGlitt</p>
        </div>

        <form action="{{ url_for('perfil.add') }}" method="POST" class="profile-form">
    
    <div class="profile-form__group">
        <label for="nombre" class="profile-form__label">NOMBRE</label>
        <input type="text" id="nombre" name="nombre" class="profile-form__input" placeholder="Ej. Juan" required>
    </div>

    <div class="profile-form__group">
        <label for="apellido" class="profile-form__label">APELLIDO</label>
        <input type="text" id="apellido" name="apellido" class="profile-form__input" placeholder="Ej. Pérez">
    </div>

    <div class="profile-form__group">
        <label for="bio" class="profile-form__label">BIOGRAFÍA</label>
        <textarea id="bio" name="bio" class="profile-form__textarea" rows="4" placeholder="Cuéntanos algo sobre ti..."></textarea>
    </div>

    <div class="profile-form__actions">
        <button type="submit" class="btn-submit">Crear Perfil</button>
        <br>
        <a href="{{ url_for('perfil.index') }}" class="btn-cancel">Cancelar y volver</a>
    </div>
</form>
    </div>
</div>
{% endblock %}
