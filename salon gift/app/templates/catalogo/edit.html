{% extends "base.html" %}
{% block title %}Editar Elemento{% endblock %}
{% block body_class %}catalogo-page{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/catalogo.css') }}">
{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-luxury">
                <div class="card-header-gold">
                    <h5><i class="fas fa-edit"></i> Editar Elemento del Catálogo</h5>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('catalogo.editar', id=item.idcatalogo) }}" method="POST">
                        <div class="row mb-3">
                            <div class="col-md-7">
                                <label class="form-label">Nombre</label>
                                <div class="input-luxury-wrapper">
                                    <i class="fas fa-tag"></i>
                                    <input type="text" name="nombre" value="{{ item.nombre }}" required>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">Precio</label>
                                <div class="input-luxury-wrapper">
                                    <span class="input-prefix">$</span>
                                    <input type="number" name="precio" step="0.01" min="0" value="{{ item.precio }}" required>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Categoría</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-folder"></i>
                                <input type="text" name="categoria" value="{{ item.categoria }}" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Descripción</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-align-left"></i>
                                <textarea name="descripcion" rows="3">{{ item.descripcion }}</textarea>
                            </div>
                        </div>
                        <div class="action-buttons">
                            <a href="{{ url_for('catalogo.index') }}" class="btn btn-pink-outline">Cancelar</a>
                            <button type="submit" class="btn btn-gold">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
