{% extends "base.html" %}
{% block title %}Nueva Imagen{% endblock %}
{% block body_class %}gallery-page{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/galeria.css') }}">
{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-luxury">
                <div class="card-header-gold">
                    <h5><i class="fas fa-upload"></i> Agregar Imagen a la Galería</h5>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('galeria.nueva') }}" method="POST" enctype="multipart/form-data">
                        <div class="form-group">
                            <label class="form-label">Título</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-heading"></i>
                                <input type="text" name="titulo" placeholder="Título de la imagen" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Descripción</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-align-left"></i>
                                <textarea name="descripcion" rows="3" placeholder="Descripción opcional..."></textarea>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Imagen</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-image"></i>
                                <input type="file" name="imagen" accept="image/*" required>
                            </div>
                        </div>
                        <div class="action-buttons">
                            <a href="{{ url_for('galeria.index') }}" class="btn btn-pink-outline">Cancelar</a>
                            <button type="submit" class="btn btn-gold">Subir Imagen</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
