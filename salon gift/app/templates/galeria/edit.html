{% extends "base.html" %}
{% block title %}Editar Imagen{% endblock %}
{% block body_class %}gallery-page{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/galeria.css') }}">
{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-luxury">
                <div class="card-header-gold">
                    <h5><i class="fas fa-edit"></i> Editar Imagen</h5>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('galeria.editar', id=imagen.idgaleria) }}" method="POST" enctype="multipart/form-data">
                        <div class="form-group">
                            <label class="form-label">Título</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-heading"></i>
                                <input type="text" name="titulo" value="{{ imagen.titulo }}" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Descripción</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-align-left"></i>
                                <textarea name="descripcion" rows="3">{{ imagen.descripcion }}</textarea>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Cambiar Imagen (opcional)</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-image"></i>
                                <input type="file" name="imagen" accept="image/*">
                            </div>
                            <small class="text-muted">Actual: {{ imagen.imagen }}</small>
                        </div>
                        <div class="action-buttons">
                            <a href="{{ url_for('galeria.index') }}" class="btn btn-pink-outline">Cancelar</a>
                            <button type="submit" class="btn btn-gold">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
