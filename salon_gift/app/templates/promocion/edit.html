{% extends "base.html" %}
{% block title %}Promo del Mes{% endblock %}
{% block body_class %}promo-page{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/promocion.css') }}">
{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card card-luxury">
                <div class="card-header-gold">
                    <h5><i class="fas fa-bullhorn"></i> Editar Promo del Mes</h5>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('promocion.editar') }}" method="POST">
                        <div class="form-group">
                            <label class="form-label">Título</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-heading"></i>
                                <input type="text" name="titulo" value="{{ promo.titulo }}" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Descripción</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-align-left"></i>
                                <textarea name="descripcion" rows="4" required>{{ promo.descripcion }}</textarea>
                            </div>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" name="activa" class="form-check-input" id="activa" {% if promo.activa %}checked{% endif %}>
                            <label class="form-check-label" for="activa">Promoción activa</label>
                        </div>
                        <div class="action-buttons">
                            <a href="{{ url_for('user.admin_dashboard') }}" class="btn btn-outline">Volver</a>
                            <button type="submit" class="btn btn-gold">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
