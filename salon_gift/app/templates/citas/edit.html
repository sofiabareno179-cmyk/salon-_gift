{% extends "base.html" %}

{% block title %}Editar Cita | Salon Gift{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/crono.css') }}">
{% endblock %}

{% block content %}
<div class="appointment-form-container">
    <div class="glass-card">
        <div class="glass-card__header">
            <h4>Editar Detalles de Cita</h4>
            <p>Modifica la información de tu cita de servicio</p>
        </div>

        <div class="glass-card__body">
            <form action="{{ url_for('citas.editar_cita', id=cita.idcitas) }}" method="POST">
                
                <!-- Campo de Servicio -->
                <div class="form-group">
                    <label class="form-label">Servicio</label>
                    <input type="text" name="servicio" class="form-control-glass" 
                           placeholder="Ej: Corte de cabello, Manicura..." 
                           value="{{ cita.servicio if cita.servicio else '' }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Fecha y Hora</label>
                    <input type="datetime-local" name="fechahora" class="form-control-glass" 
                           value="{{ cita.fechahora.strftime('%Y-%m-%dT%H:%M') if cita.fechahora else '' }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-control-glass">
                        <option value="Pendiente" {% if cita.estado == 'Pendiente' %}selected{% endif %}>Pendiente</option>
                        <option value="Confirmada" {% if cita.estado == 'Confirmada' %}selected{% endif %}>Confirmada</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-confirm">Actualizar Cita</button>
                    <a href="{{ url_for('citas.crono_citas') }}" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
