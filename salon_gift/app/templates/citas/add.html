{% extends "base.html" %}

{% block title %}Nueva Cita | Salon Gift{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/crono.css') }}">
{% endblock %}

{% block content %}
<div class="appointment-form-container">
    <div class="glass-card">
        <div class="glass-card__header">
            <h4>Agendar Nueva Cita</h4>
            <p>Completa los detalles para el servicio</p>
        </div>

        <div class="glass-card__body">
            <form action="{{ url_for('citas.nueva_cita') }}" method="POST">
                
                <!-- Campo de Servicio (¡Importante para tu calendario!) -->
                <div class="form-group">
                    <label class="form-label">Servicio</label>
                    <input type="text" name="servicio" class="form-control-glass" 
                           placeholder="Ej: Corte de cabello, Manicura..." required>
                </div>

                <div class="form-group">
                    <label class="form-label">Fecha y Hora</label>
                    <!-- El value captura la fecha si viene del calendario -->
                    <input type="datetime-local" name="fechahora" class="form-control-glass" 
                           value="{{ request.args.get('fecha') }}T{{ request.args.get('hora') }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Estado</label>
                    <select name="estado" class="form-control-glass">
                        <option value="Pendiente" selected>Pendiente</option>
                        <option value="Confirmada">Confirmada</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-confirm">Agendar Cita</button>
                    <a href="{{ url_for('citas.crono_citas') }}" class="btn-cancel">Volver</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
