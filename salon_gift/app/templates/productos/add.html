{% extends "base.html" %}

{% block title %}Nuevo Producto{% endblock %}

{% block body_class %}product-page{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/productos.css') }}">
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card card-luxury">
                
                <div class="card-header-gold">
                    <h5 class="mb-0"><i class="fas fa-crown"></i> Añadir Producto al Inventario</h5>
                </div>

                <div class="card-body">
                    <form action="{{ url_for('productos.nuevo_producto') }}" method="POST">
                        
                        <div class="row mb-3">
                            <div class="col-md-7">
                                <label class="form-label">Nombre del Producto</label>
                                <div class="input-luxury-wrapper">
                                    <i class="fas fa-tag"></i>
                                    <input type="text" name="nombre" placeholder="Ej: Jabón Artesanal" required>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">Precio</label>
                                <div class="input-luxury-wrapper">
                                    <span class="input-prefix">$</span>
                                    <input type="number" name="precio" step="0.01" min="0" placeholder="0.00" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Categoría</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-folder"></i>
                                <input type="text" name="categoria" placeholder="Ej: Cuidado Personal" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Descripción</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-align-left"></i>
                                <textarea name="descripcion" rows="3" placeholder="Breve detalle del producto..."></textarea>
                            </div>
                        </div>

                        <div class="action-buttons">
                            <a href="{{ url_for('productos.listar_productos') }}" class="btn btn-pink-outline">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-gold">
                                Guardar Producto
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
