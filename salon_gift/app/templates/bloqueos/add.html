{% extends "base.html" %}
{% block title %}Bloquear Horario{% endblock %}
{% block body_class %}bloqueos-page{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/bloqueos.css') }}">
{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card card-luxury">
                <div class="card-header-gold">
                    <h5><i class="fas fa-ban"></i> Bloquear Horario</h5>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('bloqueos.nuevo') }}" method="POST">
                        <div class="form-group">
                            <label class="form-label">Fecha</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-calendar"></i>
                                <input type="date" name="fecha" required>
                            </div>
                        </div>
                        <div class="row" style="display:flex;gap:15px;">
                            <div class="col" style="flex:1;">
                                <div class="form-group">
                                    <label class="form-label">Hora inicio</label>
                                    <div class="input-luxury-wrapper">
                                        <i class="fas fa-clock"></i>
                                        <input type="time" name="hora_inicio" required>
                                    </div>
                                </div>
                            </div>
                            <div class="col" style="flex:1;">
                                <div class="form-group">
                                    <label class="form-label">Hora fin</label>
                                    <div class="input-luxury-wrapper">
                                        <i class="fas fa-hourglass-end"></i>
                                        <input type="time" name="hora_fin" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Motivo (opcional)</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-comment"></i>
                                <input type="text" name="motivo" placeholder="Ej: Mantenimiento, feriado...">
                            </div>
                        </div>
                        <div class="action-buttons">
                            <a href="{{ url_for('bloqueos.index') }}" class="btn btn-outline">Cancelar</a>
                            <button type="submit" class="btn btn-gold">Bloquear</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
