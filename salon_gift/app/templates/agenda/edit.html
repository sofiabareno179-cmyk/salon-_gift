{% extends "base.html" %}

{% block title %}Editar Agenda{% endblock %}

{% block body_class %}agenda-page{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/agenda.css') }}">
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-luxury">
                
                <div class="card-header-gold">
                    <h5 class="mb-0"><i class="fas fa-calendar"></i> Editar Horario</h5>
                </div>

                <div class="card-body">
                    <form action="{{ url_for('agenda.editar_agenda', id=agenda.idagenda) }}" method="POST">
                        
                        <div class="form-group">
                            <label class="form-label">Día</label>
                            <div class="input-luxury-wrapper">
                                <i class="fas fa-calendar-week"></i>
                                <select name="diasemana" required>
                                    <option value="Lunes" {% if agenda.diasemana == 'Lunes' %}selected{% endif %}>Lunes</option>
                                    <option value="Martes" {% if agenda.diasemana == 'Martes' %}selected{% endif %}>Martes</option>
                                    <option value="Miércoles" {% if agenda.diasemana == 'Miércoles' %}selected{% endif %}>Miércoles</option>
                                    <option value="Jueves" {% if agenda.diasemana == 'Jueves' %}selected{% endif %}>Jueves</option>
                                    <option value="Viernes" {% if agenda.diasemana == 'Viernes' %}selected{% endif %}>Viernes</option>
                                    <option value="Sábado" {% if agenda.diasemana == 'Sábado' %}selected{% endif %}>Sábado</option>
                                    <option value="Domingo" {% if agenda.diasemana == 'Domingo' %}selected{% endif %}>Domingo</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Desde</label>
                                    <div class="input-luxury-wrapper">
                                        <i class="fas fa-clock"></i>
                                        <input type="time" name="horainicio" value="{{ agenda.horainicio }}" required>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">Hasta</label>
                                    <div class="input-luxury-wrapper">
                                        <i class="fas fa-hourglass-end"></i>
                                        <input type="time" name="horafin" value="{{ agenda.horafin }}" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="action-buttons">
                            <a href="{{ url_for('agenda.listar_agendas') }}" class="btn btn-pink-outline">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-gold">
                                Actualizar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
